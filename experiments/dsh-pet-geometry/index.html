<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>桌宠内容原生拟合</title><link rel="stylesheet" href="style.css"><body>
<main><h1>桌宠内容原生拟合</h1><p>原始素材保留。静止轻动作与独立道具验证，不包含新走跑步态。</p>
<section><h2>内容与动作</h2><div class="actions"><button data-action="master">母版04</button><button data-action="legacy">准确0.7.1</button><button data-action="react">回应一次</button><button data-action="move">平移场景</button><button data-action="scale">切换大小</button><button data-action="props">显示/隐藏书杯</button><button data-action="disable">停用</button><button data-action="enable">启用</button></div></section>
<section><h2>桌面输入</h2><p>点击人物触发回应；拖动人物观察道具跟随。</p><button data-action="align">对齐穿透测试区域</button></section>
<pre id="receipt" aria-live="polite">等待操作</pre>
<button id="through-test">透明区域穿透测试<br><span id="through-count">点击次数：0</span></button></main><script type="module" src="console.js"></script></body></html>
