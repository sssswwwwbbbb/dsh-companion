<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>桌面桌宠隔离验证</title><link rel="stylesheet" href="style.css"><body>
<main><h1>桌面桌宠隔离验证</h1><p>旧机制素材 · 本地桌面运行。坐姿沿用旧睡姿片段，仅验证机制。</p>
<section><h2>桌面移动与回执</h2><div class="actions"><button data-native="place">回到测试位置</button><button data-native="walk">慢走向右</button><button data-native="run">小跑向左</button><button data-native="replace">停止并回应</button></div></section>
<section><h2>原生桌宠</h2><div class="actions"><button data-native="autonomy">开启自主活动</button><button data-native="reading">坐下看书</button><button data-native="work">开始工作</button><button data-native="clear-work">结束工作</button><button data-native="interact">互动并恢复</button><button data-native="move-scene">平移场景</button><button data-native="scale">切换大小</button><button data-native="switch">切换为素净皮肤</button><button data-native="restore">恢复机制皮肤</button><button data-native="disable">停用桌宠</button><button data-native="enable">启用桌宠</button></div></section>
<pre id="receipt" aria-live="polite">等待操作</pre></main><script type="module" src="console.js"></script></body></html>
